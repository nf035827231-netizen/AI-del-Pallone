<!doctype html><html><body style="margin:0;background:#111"><script>function roundRect(ctx,x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function wrapCanvasText(ctx,text,x,y,maxWidth,lineHeight,maxLines){
 const words=String(text||'').split(' ');let line='',curY=y,lines=[];
 for(const w of words){const test=line?line+' '+w:w;if(ctx.measureText(test).width>maxWidth&&line){lines.push(line);line=w;}else line=test;}
 if(line)lines.push(line);
 if(maxLines&&lines.length>maxLines){lines=lines.slice(0,maxLines);lines[maxLines-1]=lines[maxLines-1].replace(/\s*\S*$/,'')+'…';}
 for(const l of lines){ctx.fillText(l,x,curY);curY+=lineHeight;}
 return curY;
}
// Gli stemmi arrivano da domini esterni (football-data.org, api-football).
// Se quel sito non concede il permesso CORS, disegnarlo sul canvas lo
// "sporcherebbe" impedendo poi di esportare l'immagine: per questo lo
// carico con crossOrigin e, se fallisce o va in timeout, uso un cerchio con
// le iniziali invece di far fallire tutto il salvataggio.
function loadImageSafe(url,timeoutMs){
 return new Promise(resolve=>{
   if(!url)return resolve(null);
   const img=new Image();let done=false;
   img.crossOrigin='anonymous';
   img.onload=()=>{if(!done){done=true;resolve(img);}};
   img.onerror=()=>{if(!done){done=true;resolve(null);}};
   img.src=url;
   setTimeout(()=>{if(!done){done=true;resolve(null);}},timeoutMs||3000);
 });
}

function drawTeamBadge(ctx,img,name,cx,cy,r){
 ctx.save();ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.closePath();ctx.clip();
 if(img){ctx.fillStyle='#0d1526';ctx.fillRect(cx-r,cy-r,r*2,r*2);ctx.drawImage(img,cx-r,cy-r,r*2,r*2);}
 else{ctx.fillStyle='#1a2338';ctx.fillRect(cx-r,cy-r,r*2,r*2);}
 ctx.restore();
 ctx.strokeStyle='#26344b';ctx.lineWidth=4;ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke();
 if(!img){ctx.fillStyle='#e0b84a';ctx.font=`700 ${Math.round(r*0.7)}px -apple-system,sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText((name||'?').slice(0,2).toUpperCase(),cx,cy+4);}
}
